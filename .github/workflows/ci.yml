name: ci

on:
  push:
  pull_request:

jobs:
  python:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # vgamepad's Windows source build starts an interactive driver installer.
      # CI exercises the dry-run backend; install ViGEmBus on the play PC only.
      - run: uv sync --locked --no-group gamepad
      - run: uv tool install platformio
      - run: uv run --no-group gamepad ruff check .
      - run: uv run --no-group gamepad ruff format --check .
      - run: uv run --no-group gamepad pytest
      - run: uv run --no-group gamepad bodyctl --help

  firmware:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run
