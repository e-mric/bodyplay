[project]
name = "bodyctl"
version = "0.1.0"
description = "PC side of Bodyplay: webcam tier, device config, recorder, latency tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
bodyctl = "bodyctl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
# latency-video analyzer, dashboard, webcam capture
video = [
    "matplotlib>=3.8",
    "opencv-python>=4.9",
]
# Tier 0 pose estimation
webcam = ["mediapipe>=0.10"]
# Tier 0 virtual Xbox 360 pad (ViGEmBus); Windows only
gamepad = ["vgamepad==0.1.0; sys_platform == 'win32'"]
# Tier 0 RTMPose pose model on an NVIDIA GPU (`--pose rtmpose`); CUDA and cuDNN come as wheels
rtmpose = [
    "rtmlib>=0.0.16",
    "onnxruntime-gpu[cuda,cudnn]>=1.22; sys_platform != 'darwin'",
]

[tool.uv]
default-groups = ["dev", "video", "webcam", "gamepad", "rtmpose"]
# rtmlib requires the CPU onnxruntime, which shares its import name with onnxruntime-gpu
# and would shadow it: keep the CPU build only on macOS (no CUDA there).
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]
# The lock must install on both machines: some nvidia-* CUDA wheels are Linux-only.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# vgamepad ships only an sdist whose setup.py refuses to run on macOS, which
# breaks locking there. Give uv its metadata so it never builds it off Windows.
[[tool.uv.dependency-metadata]]
name = "vgamepad"
version = "0.1.0"
requires-dist = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc/bodyctl"]

[tool.pytest.ini_options]
testpaths = ["pc/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["pc"]
extend-exclude = ["firmware/.pio"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
