[project]
name = "bodyctl"
version = "0.1.0"
description = "PC side of Bodyplay: webcam tier, device config, recorder, latency tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
bodyctl = "bodyctl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
# latency-video analyzer, dashboard, webcam capture
video = ["opencv-python>=4.9"]
# Tier 0 pose estimation
webcam = ["mediapipe>=0.10"]
# Tier 0 virtual Xbox 360 pad (ViGEmBus); Windows only
gamepad = ["vgamepad==0.1.0; sys_platform == 'win32'"]

[tool.uv]
default-groups = ["dev", "video", "webcam", "gamepad"]

# vgamepad ships only an sdist whose setup.py refuses to run on macOS, which
# breaks locking there. Give uv its metadata so it never builds it off Windows.
[[tool.uv.dependency-metadata]]
name = "vgamepad"
version = "0.1.0"
requires-dist = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc/bodyctl"]

[tool.pytest.ini_options]
testpaths = ["pc/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["pc"]
extend-exclude = ["firmware/.pio"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
