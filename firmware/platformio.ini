; Bodyplay firmware.
;   pio run                      build node_belt, node_wrist, dongle, hub
;   pio run -e <env> -t upload   flash one board
;   pio test -e native           unit tests on the dev machine (no hardware)

[platformio]
default_envs = node_belt, node_wrist, dongle, hub
src_dir = src

; Arduino-ESP32 core 3.x comes from the pioarduino platform (the official
; platformio/espressif32 platform stops at core 2.x). Pinned to a release zip.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -Wall
  -DBP_FW_VERSION=\"0.1.0\"

; XIAO ESP32S3 boards run TinyUSB (USB-OTG) so they can be a HID gamepad + CDC serial.
[xiao]
extends = esp32
board = seeed_xiao_esp32s3
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:node_belt]
extends = xiao
build_src_filter = +<node/>
build_flags =
  ${xiao.build_flags}
  -DBP_ROLE_BELT

[env:node_wrist]
extends = xiao
build_src_filter = +<node/>
build_flags =
  ${xiao.build_flags}
  -DBP_ROLE_WRIST

[env:dongle]
extends = xiao
build_src_filter = +<dongle/>

[env:hub]
extends = esp32
board = esp32-s3-devkitc-1
build_src_filter = +<hub/>

; Host-side unit tests for everything in lib/ (pure C++, no Arduino).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=c++17
  -Wall
  -Wextra
