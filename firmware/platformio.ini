; Bodyplay firmware.
;   pio run                      build all board envs (node_belt[_tether], node_wrist, dongle, hub, marker)
;   pio run -e <env> -t upload   flash one board
;   pio test -e native           unit tests on the dev machine (no hardware)

[platformio]
default_envs = node_belt, node_belt_tether, node_wrist, dongle, hub, marker
src_dir = src

; Arduino-ESP32 core 3.x comes from the pioarduino platform (the official
; platformio/espressif32 platform stops at core 2.x). Pinned to a release zip.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -Wall
  -DBP_FW_VERSION=\"0.1.0\"

; XIAO ESP32S3 boards run TinyUSB (USB-OTG) so they can be a HID gamepad + CDC serial.
[xiao]
extends = esp32
board = seeed_xiao_esp32s3
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${esp32.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:node_belt]
extends = xiao
build_src_filter = +<node/>
; Worn flat on the lower back, components facing out: forward = the board's -Z.
; Change if you mount it differently (AXIS_POS_X ... AXIS_NEG_Z, see lib/gestures/mount.h).
build_flags =
  ${xiao.build_flags}
  -DBP_ROLE_BELT
  -DBP_MOUNT_FORWARD=AXIS_NEG_Z

; Tier 2 tethered belt: same node, also talks to the hub over UART (M4).
[env:node_belt_tether]
extends = env:node_belt
build_flags =
  ${env:node_belt.build_flags}
  -DBP_TETHER

[env:node_wrist]
extends = xiao
build_src_filter = +<node/>
build_flags =
  ${xiao.build_flags}
  -DBP_ROLE_WRIST

[env:dongle]
extends = xiao
build_src_filter = +<dongle/>

; Tier 0-1 output marker LED on a spare XIAO (see src/marker/main.cpp).
[env:marker]
extends = xiao
build_src_filter = +<marker/>

[env:hub]
extends = esp32
board = esp32-s3-devkitc-1
build_src_filter = +<hub/>

; Host tool: replay a .bptrace through lib/gestures (wrapped by `bodyctl replay`).
[env:replay]
platform = native
build_src_filter = +<replay/>
build_flags =
  -std=c++17
  -O2
  -Wall

; Host tool: simulated belt node (real NodeCore, protocol over stdin/stdout).
[env:nodesim]
platform = native
build_src_filter = +<nodesim/>
build_flags =
  -std=c++17
  -O2
  -Wall
  -DBP_FW_VERSION=\"sim\"

; Host-side unit tests for everything in lib/ (pure C++, no Arduino).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
  -std=c++17
  -Wall
  -Wextra
