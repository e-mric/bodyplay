# GTA V on PS5 — starter profile.
# Controls reference (default PlayStation layout):
#   https://www.gtaboom.com/gta-5-controls-pc-keyboard-playstation-and-xbox/
# Test in Performance mode (60 fps target).
#
# Thresholds are starting values to tune per user, not measured constants.

profile: gta5
game_fps: 60                    # Performance mode; set 30 for Fidelity

press:                          # virtual button timing (hard rule 8)
  hold_ms: 30
  release_ms: 30

gestures:
  step:   {peak_g: 0.25, refractory_ms: 200, stop_after_intervals: 1.5}
  cadence_curve: [1.5, 2.5, 3.5]       # steps/s where walk, jog, sprint reach full effect
  jump:   {dip_g: -0.30, dip_min_ms: 40, push_jerk: 8.0, crouch_hold_ms: 300, min_conf: 0.6}
  lean:   {deadzone_deg: 6, full_deg: 25}
  twist:  {deadzone_deg: 15, full_deg: 45, max_rate: 1.0, rezero_still_ms: 1000}
  aim:    {forearm_pitch_deg: 35}
  shoot:  {emg_k_baseline: 3.0, min_conf: 0.9}
  punch:  {accel_g: 2.0, min_conf: 0.6}
  enter_exit: {two_cue_window_ms: 150, min_conf: 0.9}

# Each port emits ONE fixed PS5 button, configured once in the PS5's
# Access controller profile. Modes below only choose which gesture drives it.
ports:
  A-E1: {type: stick,   ps5: left_stick}
  A-E2: {type: button,  ps5: cross}       # X — tap to sprint
  A-E3: {type: button,  ps5: square}      # jump
  A-E4: {type: button,  ps5: triangle}    # enter / exit vehicle
  B-E1: {type: stick,   ps5: right_stick}
  B-E2: {type: trigger, ps5: r2}          # fire / accelerate / throttle up
  B-E3: {type: trigger, ps5: l2}          # aim / brake / throttle down
  B-E4: {type: button,  ps5: circle}      # light melee (also reload)

modes:
  on_foot:
    A-E1: {y: run_cadence, x: lean}
    A-E2: {pulse: step_rhythm, when: cadence_above_sprint}   # tap X with each step
    A-E3: {event: jump}
    A-E4: {event: enter_exit}
    B-E1: {x: twist}
    B-E2: {event: shoot, requires: aiming, as: full_pull}
    B-E3: {hold: aiming, as: full_pull}
    B-E4: {event: punch}

  swim:
    A-E1: {y: stroke_rhythm, x: lean}
    A-E2: {pulse: stroke_rhythm}
    A-E4: {event: enter_exit}
    B-E1: {x: twist}

  car:                       # also bike and boat; the DualSense steers
    A-E1: neutral
    A-E4: {event: enter_exit, requires: stopped}
    B-E1: neutral
    B-E2: {analog: run_cadence}          # accelerate
    B-E3: {analog: step_back_or_lean_back}  # brake / reverse
    B-E4: neutral

  aircraft:                  # plane and helicopter; the DualSense flies (stick, L1/R1 yaw)
    A-E1: neutral
    A-E4: {event: enter_exit, requires: stopped}
    B-E1: neutral
    B-E2: {analog: run_cadence}          # throttle up
    B-E3: {analog: step_back_or_lean_back}  # throttle down
    B-E4: neutral

  qte:
    A-E2: {pulse: fast_feet, max_hz: 15}  # mash prompts
    # timed single prompts: any sharp gesture presses the prompted port (set by the PC side path)

# Left to the DualSense: R1 cover / handbrake, L3 stealth / horn, L1 weapon wheel,
# D-pad phone, R3 look behind, aircraft yaw and landing gear, menus.
